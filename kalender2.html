<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SPORT LIVE | Kalender</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #fdfdfd;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            color: #1a1a1a;
        }

        /* --- VISNINGS-CONTAINERE --- */
        #calendar-container {
            display: flex;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 0;
            transition: opacity 0.8s ease-in-out;
            opacity: 1;
            z-index: 10;
        }

        #next-live-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #fdfdfd;
            color: #1a1a1a;
            transition: opacity 0.8s ease-in-out;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
        }

        /* --- STRUKTUR TIL CENTRERING AF NEDTÆLLING --- */
        .nl-top {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; 
            align-items: center;
            padding-bottom: 5vh;
            width: 100%;
        }

        .nl-bottom {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            align-items: center;
            padding-top: 7vh; 
            width: 100%;
            gap: 3vh; 
        }

        /* --- DESIGN TIL NÆSTE LIVE-SKÆRM --- */
        .nl-logo {
            max-width: 40vw; 
            max-height: 25vh;
            margin-bottom: 3vh;
        }

        .nl-header {
            font-size: 3.8vw;
            font-weight: 900;
            color: #1a1a1a; 
            letter-spacing: 0.3vw;
            text-transform: uppercase;
        }

        .countdown-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5vw;
        }

        .cd-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #ffffff;
            padding: 2vw 2.5vw;
            border-radius: 1vw;
            min-width: 12vw;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            border: 1px solid #eaeaea;
        }

        .cd-num {
            font-size: 9vw;
            font-weight: 900;
            line-height: 1;
            color: #1a1a1a;
            font-variant-numeric: tabular-nums; 
        }

        .cd-label {
            font-size: 1.5vw;
            font-weight: 700;
            color: #888888;
            margin-top: 1vh;
            letter-spacing: 0.2vw;
        }

        .cd-colon {
            font-size: 6vw;
            font-weight: 900;
            color: #cccccc;
            margin-bottom: 3vh;
        }

        .nl-sub {
            font-size: 2.2vw;
            font-weight: 700;
            color: #888888;
            letter-spacing: 0.4vw;
            text-transform: uppercase;
            text-align: center;
            line-height: 1;
        }

        .nl-title {
            font-size: 3.8vw; 
            font-weight: 900; 
            color: #dd5f12; 
            text-align: center;
            width: 95vw;
            line-height: 1.1;
            text-transform: uppercase;
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis; 
        }

        .sender-nu {
            font-size: 8vw;
            font-weight: 900;
            color: #dc3545;
            letter-spacing: 0.5vw;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%   { opacity: 1; }
            50%  { opacity: 1; }    
            75%  { opacity: 0.2; }  
            100% { opacity: 1; }    
        }

        /* --- DET EKSISTERENDE KALENDER DESIGN --- */
        .month-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #d0d0d0; 
            box-sizing: border-box;
            min-width: 0; 
        }
        
        .month-column:last-child { border-right: none; }

        .month-header {
            height: 3.2vh; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1vw; 
            font-weight: 800;
            text-transform: uppercase;
            border-bottom: 2px solid #a0a0a0;
            background-color: #fdfdfd; 
            letter-spacing: 2px;
            z-index: 10;
            flex-shrink: 0;
        }

        .day-row {
            height: calc(96.8vh / 31); 
            display: flex;
            border-bottom: 1px solid #c0c0c0; 
            box-sizing: border-box;
            overflow: hidden;
            position: relative; 
        }
        
        .day-row:last-child { border-bottom: none; }

        .date-number {
            width: 1.6vw; 
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75vw; 
            font-weight: 700;
            border-right: 1px solid #c0c0c0; 
            background-color: #f4f4f4; 
            flex-shrink: 0;
        }

        .date-circle {
            width: 1.2vw;
            height: 1.2vw;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .weekend .date-circle {
            background-color: #e68a8a; 
            color: #ffffff;
            font-weight: 600; 
        }

        .date-content {
            flex: 1;
            position: relative; 
            overflow: hidden;
        }

        .animator-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1); 
        }

        .page {
            height: 100%;
            width: 100%;
            padding: 3px 1.5vw 0px 6px; 
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: flex-start; 
            gap: 2px; 
        }

        .program-line {
            font-size: 0.62vw; 
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip; 
            line-height: 1.05; 
            margin-bottom: 0; 
            -webkit-mask-image: linear-gradient(to right, black 90%, transparent 100%);
            mask-image: linear-gradient(to right, black 90%, transparent 100%);
        }

        .paging-dots {
            position: absolute;
            right: 0.4vw;
            top: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3px;
            width: 0.6vw;
        }

        .dot {
            width: 3px; 
            height: 3px; 
            background-color: #d0d0d0;
            border-radius: 50%;
            transition: background-color 0.8s, transform 0.8s;
        }

        .dot.active {
            background-color: #555;
            transform: scale(1.4); 
        }

        .color-blue { color: #0056b3; }
        .color-green { color: #28a745; }
        .color-black { color: #1a1a1a; }
        .color-red { color: #dc3545; }

        .even-week { background-color: #f5f7f9; }
        .even-week .date-number { background-color: #ebedf0; }

        .empty-day .date-number { background-color: transparent; border-right: 1px solid transparent; }
        .empty-day { border-bottom: 1px solid transparent; }

        #loader {
            position: fixed;
            top: 10px;
            right: 10px;
            font-size: 0.7vw;
            color: #ccc;
            z-index: 100;
            transition: opacity 0.3s;
        }
    </style>
</head>
<body>

    <div id="loader">Opdaterer...</div>
    
    <!-- KALENDER VISNING -->
    <div id="calendar-container"></div>

    <!-- NÆSTE LIVE VISNING -->
    <div id="next-live-container">
        <!-- TOP: Logo og overskrift -->
        <div class="nl-top">
            <img src="https://raw.githubusercontent.com/sportlivedk/produktioner/refs/heads/main/logo.png" alt="SPORT LIVE" class="nl-logo" id="sl-logo">
            <div class="nl-header">Næste live-transmission</div>
        </div>
        
        <!-- MIDT: Nedtælling -->
        <div id="countdown-display" class="countdown-wrapper">
            <div class="cd-box">
                <div class="cd-num" id="cd-days">00</div>
                <div class="cd-label" id="cd-days-label">DAGE</div>
            </div>
            <div class="cd-colon">:</div>
            <div class="cd-box">
                <div class="cd-num" id="cd-hours">00</div>
                <div class="cd-label" id="cd-hours-label">TIMER</div>
            </div>
            <div class="cd-colon">:</div>
            <div class="cd-box">
                <div class="cd-num" id="cd-minutes">00</div>
                <div class="cd-label">MIN</div>
            </div>
            <div class="cd-colon">:</div>
            <div class="cd-box">
                <div class="cd-num" id="cd-seconds">00</div>
                <div class="cd-label">SEK</div>
            </div>
        </div>
        
        <!-- BUND: Sportsgren, Programtitel og Lokation -->
        <div class="nl-bottom">
            <div id="nl-sport" class="nl-sub"></div>
            <div id="nl-title" class="nl-title">INDLÆSER...</div>
            <div id="nl-location" class="nl-sub"></div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbznTiMKZZDJhmuZpArHJLwZcN-Ic745YuXZitWrdDojG-L3KuW-VXy0mtJUPOE3xCR1/exec';
        const container = document.getElementById('calendar-container');
        const monthNames = ['JANUAR', 'FEBRUAR', 'MARTS', 'APRIL', 'MAJ', 'JUNI', 'JULI', 'AUGUST', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DECEMBER'];
        
        let produktioner = [];
        let globalTick = 0; 
        
        // --- ROTATIONS-LOGIK ---
        let isShowingCalendar = true;
        
        function switchViews() {
            const cal = document.getElementById('calendar-container');
            const nl = document.getElementById('next-live-container');
            
            if (isShowingCalendar) {
                cal.style.opacity = '0';
                cal.style.pointerEvents = 'none';
                
                setTimeout(() => { 
                    nl.style.opacity = '1'; 
                    nl.style.pointerEvents = 'auto'; 
                }, 800);
                
                isShowingCalendar = false;
                setTimeout(switchViews, 20000); 
            } else {
                nl.style.opacity = '0';
                nl.style.pointerEvents = 'none';
                
                setTimeout(() => { 
                    cal.style.opacity = '1'; 
                    cal.style.pointerEvents = 'auto'; 
                }, 800);
                
                isShowingCalendar = true;
                setTimeout(switchViews, 300000); 
            }
        }
        
        // --- SKUDSIKKER DATO- OG TIDS-LOGIK ---
        let nextProgramDateObj = null;

        function extractTimeFromStr(tStr) {
            if (!tStr) return null;
            let m = String(tStr).match(/(\d{1,2})\s*[:.]+\s*(\d{2})/);
            return m ? { h: parseInt(m[1], 10), m: parseInt(m[2], 10) } : null;
        }

        function parseDateTimeForCountdown(datoRaw, txRaw, rxRaw, tidRaw) {
            if (!datoRaw || String(datoRaw).trim() === "" || String(datoRaw).trim() === "-") return null;
            
            let d = null;
            let str = String(datoRaw).trim();
            
            let dateMatch = str.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);
            if (dateMatch) {
                d = new Date(parseInt(dateMatch[3], 10), parseInt(dateMatch[2], 10) - 1, parseInt(dateMatch[1], 10));
            } else {
                d = new Date(str);
            }
            
            if (!d || isNaN(d.getTime())) return null;

            let tMatch = extractTimeFromStr(txRaw);
            if (!tMatch) tMatch = extractTimeFromStr(rxRaw);
            if (!tMatch) tMatch = extractTimeFromStr(tidRaw);
            
            if (tMatch) {
                d.setHours(tMatch.h, tMatch.m, 0, 0);
            } else {
                d.setHours(0,0,0,0);
            }
            
            return d;
        }

        function vaskTekstSplit(sportsgren, titel) {
            let s = sportsgren ? String(sportsgren).trim() : "";
            let t = titel ? String(titel).trim() : "";

            const forkortelser = [
                { fra: /Basketball/gi, til: "Basket" },
                { fra: /Volleyball/gi, til: "Volley" },
                { fra: /Amerikansk fodbold/gi, til: "Football" },
                { fra: /European League/gi, til: "EL" },
                { fra: /Randers Cimbria/gi, til: "Randers" },
                { fra: /Team FOG Næstved/gi, til: "Næstved" },
                { fra: /Horsens IC/gi, til: "Horsens" },
                { fra: /Værløse Blue Hawks/gi, til: "Værløse" },
                { fra: /Svendborg Rabbits/gi, til: "Svendborg" },
                { fra: /BMS Herlev/gi, til: "Herlev" },
                { fra: /Bakken Bears/gi, til: "Bakken" },
                { fra: /BK Vejen/gi, til: "Vejen" },
                { fra: /Hørsholm Rungsted/gi, til: "HRT" },
                { fra: /United States/gi, til: "USA" },
                { fra: /kvalifikation/gi, til: "kval" }
            ];

            forkortelser.forEach(f => {
                s = s.replace(f.fra, f.til);
                t = t.replace(f.fra, f.til);
            });

            return {
                sport: s,
                titel: t,
                visSport: (s !== "")
            };
        }

        function findNextLiveProgram() {
            let now = new Date();
            let activeLimit = new Date(now.getTime() - (0.5 * 60 * 60 * 1000));
            let futureLive = [];

            // NEDTÆLLING: Udelukkende SPORT LIVE og ikke TBC
            produktioner.forEach(p => {
                let kanal = String(p.Kanal || "").trim().toUpperCase();
                let erTBC = (p.TBC && String(p.TBC).trim().toUpperCase() === "X");
                
                if (kanal === "SPORT LIVE" && !erTBC) {
                    let pDato = parseDateTimeForCountdown(p.Dato, p.TX, p.RX, p.Tid);
                    
                    if (pDato && pDato > activeLimit) {
                        futureLive.push({ program: p, dateObj: pDato });
                    }
                }
            });

            futureLive.sort((a, b) => a.dateObj - b.dateObj);

            while (futureLive.length > 1) {
                let p0 = futureLive[0];
                let p1 = futureLive[1];
                
                if (now >= p0.dateObj) {
                    if (p1.dateObj.getTime() - p0.dateObj.getTime() < 0.5 * 60 * 60 * 1000) {
                        futureLive.shift();
                        continue;
                    }
                }
                break; 
            }

            if (futureLive.length > 0) {
                let next = futureLive[0];
                nextProgramDateObj = next.dateObj;
                
                let vasket = vaskTekstSplit(next.program.Sportsgren, next.program.Programtitel);
                const sportEl = document.getElementById('nl-sport');
                if (vasket.visSport) {
                    sportEl.textContent = vasket.sport.toUpperCase();
                    sportEl.style.display = 'block';
                } else {
                    sportEl.style.display = 'none';
                }

                document.getElementById('nl-title').textContent = vasket.titel.toUpperCase();

                const locEl = document.getElementById('nl-location');
                let lokationTxt = next.program.Lokation ? String(next.program.Lokation).trim() : "";
                if (lokationTxt !== "" && lokationTxt !== "-") {
                    locEl.textContent = lokationTxt.toUpperCase();
                    locEl.style.display = 'block';
                } else {
                    locEl.style.display = 'none';
                }
                
            } else {
                nextProgramDateObj = null;
                document.getElementById('nl-sport').style.display = 'none';
                document.getElementById('nl-location').style.display = 'none';
                document.getElementById('nl-title').textContent = "INGEN PLANLAGTE LIVE-UDSENDELSER";
            }
        }

        function tickCountdown() {
            let cdDisplay = document.getElementById('countdown-display');
            if (!nextProgramDateObj) {
                cdDisplay.style.display = 'none';
                return;
            }
            
            let now = new Date();
            let diff = nextProgramDateObj - now;

            if (diff <= 0) {
                cdDisplay.style.display = 'flex';
                if (!cdDisplay.querySelector('.sender-nu')) {
                    cdDisplay.innerHTML = '<div class="sender-nu">SENDER NU</div>';
                }
                return;
            }
            
            cdDisplay.style.display = 'flex';

            if (cdDisplay.querySelector('.sender-nu')) {
                cdDisplay.innerHTML = `
                    <div class="cd-box">
                        <div class="cd-num" id="cd-days">00</div>
                        <div class="cd-label" id="cd-days-label">DAGE</div>
                    </div>
                    <div class="cd-colon">:</div>
                    <div class="cd-box">
                        <div class="cd-num" id="cd-hours">00</div>
                        <div class="cd-label" id="cd-hours-label">TIMER</div>
                    </div>
                    <div class="cd-colon">:</div>
                    <div class="cd-box">
                        <div class="cd-num" id="cd-minutes">00</div>
                        <div class="cd-label">MIN</div>
                    </div>
                    <div class="cd-colon">:</div>
                    <div class="cd-box">
                        <div class="cd-num" id="cd-seconds">00</div>
                        <div class="cd-label">SEK</div>
                    </div>
                `;
            }
            
            let d = Math.floor(diff / (1000 * 60 * 60 * 24));
            let h = Math.floor((diff / (1000 * 60 * 60)) % 24);
            let m = Math.floor((diff / 1000 / 60) % 60);
            let s = Math.floor((diff / 1000) % 60);
            
            const elDays = document.getElementById('cd-days');
            if(elDays) {
                elDays.textContent = String(d).padStart(2, '0');
                document.getElementById('cd-hours').textContent = String(h).padStart(2, '0');
                document.getElementById('cd-minutes').textContent = String(m).padStart(2, '0');
                document.getElementById('cd-seconds').textContent = String(s).padStart(2, '0');
                
                document.getElementById('cd-days-label').textContent = (d === 1) ? "DAG" : "DAGE";
                document.getElementById('cd-hours-label').textContent = (h === 1) ? "TIME" : "TIMER";
            }
        }

        // --- KALENDER FARVE- OG PRIORITERINGSSTYRING ---
        function getProgramColorAndPriority(p) {
            const colorBlueUnits = ["minitech", "nowtek ob1", "nowtek ob2", "ob", "ob 7", "ob 9", "ob 7+9", "sam ob"];
            const boksUnits = ["boks", "boks 1", "boks 2", "boks 3", "boks 4", "boks 5", "boks 6", "boks 7", "brt", "srt"];

            if (p._isMerged) {
                if (p._mergedHasSportLiveOB) {
                    return { color: 'color-blue', prio: 1 };
                } else if (p._mergedHasExternalOB) {
                    return { color: 'color-red', prio: 4 }; 
                } else {
                    return { color: 'color-black', prio: 3 }; 
                }
            }

            const kanalNavn = String(p.Kanal || "").trim().toUpperCase();
            const unitLower = String(p.Unit || "").toLowerCase().trim();

            if (kanalNavn === "SPORT LIVE" && (colorBlueUnits.includes(unitLower) || unitLower === "")) {
                return { color: 'color-blue', prio: 1 };
            } else if (kanalNavn === "SPORT LIVE" && boksUnits.includes(unitLower)) {
                return { color: 'color-green', prio: 2 };
            } else if (kanalNavn === "EFP" || unitLower === "efp" || kanalNavn === "OPTAGELSE") {
                return { color: 'color-black', prio: 3 };
            } else if (kanalNavn !== "SPORT LIVE" && colorBlueUnits.includes(unitLower)) {
                return { color: 'color-red', prio: 4 }; // Ekstern OB -> Rød
            } else {
                return { color: 'color-black', prio: 3 }; 
            }
        }

        function parseTime(t) {
            if (!t) return "99:99"; 
            let str = String(t).replace('.', ':').trim();
            if (str.length === 4 && str.includes(':')) {
                str = "0" + str;
            }
            return str;
        }

        function vaskTekst(sportsgren, titel) {
            let s = sportsgren ? String(sportsgren).trim() : "";
            let t = titel ? String(titel).trim() : "";

            const forkortelser = [
                { fra: /Basketball/gi, til: "Basket" },
                { fra: /Volleyball/gi, til: "Volley" },
                { fra: /Amerikansk fodbold/gi, til: "Football" },
                { fra: /European League/gi, til: "EL" },
                { fra: /Randers Cimbria/gi, til: "Randers" },
                { fra: /Team FOG Næstved/gi, til: "Næstved" },
                { fra: /Horsens IC/gi, til: "Horsens" },
                { fra: /Værløse Blue Hawks/gi, til: "Værløse" },
                { fra: /Svendborg Rabbits/gi, til: "Svendborg" },
                { fra: /BMS Herlev/gi, til: "Herlev" },
                { fra: /Bakken Bears/gi, til: "Bakken" },
                { fra: /BK Vejen/gi, til: "Vejen" },
                { fra: /Hørsholm Rungsted/gi, til: "HRT" },
                { fra: /United States/gi, til: "USA" },
                { fra: /kvalifikation/gi, til: "kval" }
            ];

            const udeladelser = [
                "basket", "futsal", "volley", "tennis", "kajak", "roning", "bordtennis", 
                "WTT", "davis cup", "billie jean king cup", "mermaid bowl", "gokart"
            ];

            forkortelser.forEach(f => {
                s = s.replace(f.fra, f.til);
                t = t.replace(f.fra, f.til);
            });

            let visSportsgren = true;
            const tLower = t.toLowerCase();
            udeladelser.forEach(ord => {
                if (tLower.includes(ord.toLowerCase())) visSportsgren = false;
            });

            return (!visSportsgren || s === "") ? t : `${s}: ${t}`;
        }

        function getEaster(year) {
            const a = year % 19, b = Math.floor(year / 100), c = year % 100;
            const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
            const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
            const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
            const m = Math.floor((a + 11 * h + 22 * l) / 451);
            const month = Math.floor((h + l - 7 * m + 114) / 31) - 1;
            const day = ((h + l - 7 * m + 114) % 31) + 1;
            return new Date(year, month, day);
        }

        function isHoliday(y, m, d) {
            const dateStr = y + "-" + String(m + 1).padStart(2, '0') + "-" + String(d).padStart(2, '0');
            const easter = getEaster(y);
            const addDays = (date, days) => {
                const res = new Date(date.getTime());
                res.setDate(res.getDate() + days);
                return res.getFullYear() + "-" + String(res.getMonth() + 1).padStart(2, '0') + "-" + String(res.getDate()).padStart(2, '0');
            };
            const h = [y+"-01-01", y+"-06-05", y+"-12-24", y+"-12-25", y+"-12-26", y+"-12-31", addDays(easter, -3), addDays(easter, -2), addDays(easter, 0), addDays(easter, 1), addDays(easter, 39), addDays(easter, 49), addDays(easter, 50)];
            return h.includes(dateStr);
        }

        function getWeekNumber(d) {
            d = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            d.setUTCDate(d.getUTCDate() + 4 - (d.getUTCDay() || 7));
            return Math.ceil((((d - new Date(Date.UTC(d.getUTCFullYear(), 0, 1))) / 86400000) + 1) / 7);
        }

        async function fetchProductionData() {
            const loader = document.getElementById('loader');
            if(loader) loader.style.opacity = "1";
            try {
                const response = await fetch(scriptURL + "?action=getdata");
                const data = await response.json();
                produktioner = data.programmer || [];
                tegnKalender();
                findNextLiveProgram(); 
            } catch (error) { console.error(error); }
            if(loader) loader.style.opacity = "0";
        }

        function tegnKalender() {
            container.innerHTML = '';
            const currentDate = new Date();
            const currentMonthIndex = currentDate.getMonth();
            const currentYear = currentDate.getFullYear();
            const colorBlueUnits = ["minitech", "nowtek ob1", "nowtek ob2", "ob", "ob 7", "ob 9", "ob 7+9", "sam ob"];

            for (let i = 0; i < 5; i++) {
                let m = (currentMonthIndex + i) % 12;
                let y = currentYear + Math.floor((currentMonthIndex + i) / 12);
                let daysInMonth = new Date(y, m + 1, 0).getDate();

                let col = document.createElement('div');
                col.className = 'month-column';
                let header = document.createElement('div');
                header.className = 'month-header';
                header.textContent = monthNames[m];
                col.appendChild(header);

                for (let d = 1; d <= 31; d++) {
                    let row = document.createElement('div');
                    row.className = 'day-row';
                    let dateBox = document.createElement('div');
                    dateBox.className = 'date-number';
                    let contentBox = document.createElement('div');
                    contentBox.className = 'date-content';

                    if (d <= daysInMonth) {
                        let circle = document.createElement('div');
                        circle.className = 'date-circle';
                        circle.textContent = d;
                        dateBox.appendChild(circle);

                        let dateObj = new Date(y, m, d);
                        
                        if (dateObj.getDay() === 0 || dateObj.getDay() === 6 || isHoliday(y, m, d)) row.classList.add('weekend');
                        if (getWeekNumber(dateObj) % 2 === 0) row.classList.add('even-week');

                        // KALENDER-FILTER: Viser SPORT LIVE, alle OB-produktioner og alle EFP-produktioner
                        let dagensProduktioner = produktioner.filter(p => {
                            if (!p.Dato) return false;
                            const pDato = new Date(p.Dato);
                            return (pDato.getFullYear() === y && pDato.getMonth() === m && pDato.getDate() === d);
                        }).filter(p => {
                            const kanalNavn = String(p.Kanal || "").trim().toUpperCase();
                            const unitLower = String(p.Unit || "").toLowerCase().trim();
                            
                            const isSportLive = (kanalNavn === "SPORT LIVE");
                            const isOB = colorBlueUnits.includes(unitLower);
                            const isEFP = (unitLower === "efp" || kanalNavn === "EFP" || kanalNavn === "OPTAGELSE");

                            return isSportLive || isOB || isEFP;
                        });

                        if (dagensProduktioner.length > 0) {
                            let titleMap = new Map();

                            dagensProduktioner.forEach(p => {
                                let titel = String(p.Programtitel || "").trim();
                                let unitLower = String(p.Unit || "").toLowerCase().trim();
                                let kanalNavn = String(p.Kanal || "").trim().toUpperCase();

                                let isSportLiveOB = (kanalNavn === "SPORT LIVE" && (colorBlueUnits.includes(unitLower) || unitLower === ""));
                                let isExternalOB = (kanalNavn !== "SPORT LIVE" && colorBlueUnits.includes(unitLower));

                                if (!titleMap.has(titel)) {
                                    titleMap.set(titel, { 
                                        original: p, 
                                        isDuplicate: false, 
                                        hasSportLiveOB: isSportLiveOB,
                                        hasExternalOB: isExternalOB 
                                    });
                                } else {
                                    let entry = titleMap.get(titel);
                                    entry.isDuplicate = true;
                                    if (isSportLiveOB) entry.hasSportLiveOB = true;
                                    if (isExternalOB) entry.hasExternalOB = true;
                                    if (kanalNavn === "SPORT LIVE") entry.original = p;
                                }
                            });

                            dagensProduktioner = Array.from(titleMap.values()).map(entry => {
                                let p = entry.original;
                                if (entry.isDuplicate) {
                                    p = Object.assign({}, p); 
                                    p._isMerged = true;
                                    p._mergedHasSportLiveOB = entry.hasSportLiveOB;
                                    p._mergedHasExternalOB = entry.hasExternalOB;
                                }
                                return p;
                            });

                            dagensProduktioner.sort((a, b) => {
                                const infoA = getProgramColorAndPriority(a);
                                const infoB = getProgramColorAndPriority(b);
                                if (infoA.prio !== infoB.prio) return infoA.prio - infoB.prio;
                                if (infoA.prio === 1 || infoA.prio === 2) {
                                    return parseTime(a.Tid).localeCompare(parseTime(b.Tid));
                                }
                                return 0; 
                            });

                            const totalPages = Math.ceil(dagensProduktioner.length / 2);
                            const animatorWrapper = document.createElement('div');
                            animatorWrapper.className = 'animator-wrapper';
                            animatorWrapper.dataset.pages = totalPages;

                            for (let pageIdx = 0; pageIdx < totalPages; pageIdx++) {
                                const pageDiv = document.createElement('div');
                                pageDiv.className = 'page';
                                const startIdx = pageIdx * 2;
                                const visningsData = dagensProduktioner.slice(startIdx, startIdx + 2);

                                visningsData.forEach(p => {
                                    const line = document.createElement('div');
                                    line.className = 'program-line';
                                    const info = getProgramColorAndPriority(p);
                                    line.classList.add(info.color);
                                    let tbcTxt = (p.TBC && String(p.TBC).toUpperCase() === 'X') ? " (TBC)" : "";
                                    line.textContent = vaskTekst(p.Sportsgren, p.Programtitel) + tbcTxt;
                                    pageDiv.appendChild(line);
                                });
                                animatorWrapper.appendChild(pageDiv);
                            }
                            contentBox.appendChild(animatorWrapper);

                            if (totalPages > 1) {
                                const startPage = globalTick % totalPages;
                                animatorWrapper.style.transform = `translateY(-${startPage * 100}%)`;
                                const dotsContainer = document.createElement('div');
                                dotsContainer.className = 'paging-dots';
                                for (let p = 0; p < totalPages; p++) {
                                    const dot = document.createElement('div');
                                    dot.className = 'dot' + (p === startPage ? ' active' : '');
                                    dotsContainer.appendChild(dot);
                                }
                                row.appendChild(dotsContainer);
                            }
                        }
                    } else { row.classList.add('empty-day'); }

                    row.appendChild(dateBox);
                    row.appendChild(contentBox);
                    col.appendChild(row);
                }
                container.appendChild(col);
            }
        }

        function opdaterAnimationer() {
            globalTick++;
            const wrappers = document.querySelectorAll('.animator-wrapper');
            wrappers.forEach(wrapper => {
                const totalPages = parseInt(wrapper.dataset.pages);
                if (totalPages > 1) {
                    const currentPage = globalTick % totalPages;
                    wrapper.style.transform = `translateY(-${currentPage * 100}%)`;
                    const row = wrapper.closest('.day-row');
                    const dots = row.querySelectorAll('.dot');
                    dots.forEach((dot, index) => {
                        if (index === currentPage) dot.classList.add('active');
                        else dot.classList.remove('active');
                    });
                }
            });
        }

        // KICK-OFF
        fetchProductionData();
        setInterval(fetchProductionData, 1200000); 
        setInterval(opdaterAnimationer, 7000);
        setInterval(tickCountdown, 1000); 
        
        setTimeout(switchViews, 300000);

    </script>
</body>
